services:
  php:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html/api
    environment:
      DB_HOST: mysql
      DB_NAME: ttpacursus
      DB_USER: ttpa
      DB_PASS: ttpa_secret
      # Local mail goes to Mailpit (web UI: http://localhost:8025)
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: noreply@ttpacursus.test
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: ttpacursus
      MYSQL_USER: ttpa
      MYSQL_PASSWORD: ttpa_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root_secret
    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql_data:
